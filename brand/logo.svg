<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Miru">
  <!--
    Concept: an eye + signal layers ("見る" = "to see").
    Three concentric rounded squares represent: 自端末 → relay → 相手。
    The dot in the center: the moment of seeing.
  -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C4CC"/>
      <stop offset="100%" stop-color="#008A91"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C4CC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00C4CC" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square (peer device) -->
  <rect x="16" y="16" width="224" height="224" rx="48" ry="48"
        stroke="url(#ring)" stroke-width="6" stroke-opacity="0.6" fill="none"/>

  <!-- Middle rounded square (relay layer) -->
  <rect x="56" y="56" width="144" height="144" rx="32" ry="32"
        stroke="url(#ring)" stroke-width="6" stroke-opacity="0.85" fill="none"/>

  <!-- Inner rounded square (self) -->
  <rect x="92" y="92" width="72" height="72" rx="18" ry="18"
        fill="url(#grad)"/>

  <!-- Center dot: the moment of seeing -->
  <circle cx="128" cy="128" r="10" fill="#001012"/>
</svg>
