# cargo-deny configuration.
# See https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─── Advisories (RustSec database) ────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Hard fail on known vulnerabilities and unmaintained crates.
yanked = "deny"
ignore = []

# ─── Licenses ────────────────────────────────────────────────────────────────
[licenses]
# Confidence threshold for license detection.
confidence-threshold = 0.93
# Allowed licenses — explicit allowlist, no copyleft.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",          # narrowly scoped Mozilla source files; weakly copyleft
    "OpenSSL",          # for ring's vendored copy
    "BSL-1.0",
]
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ─── Banned crates ────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-build-scripts = []   # an empty allowlist means "no specific allowance" — checked manually

# Crates that are deliberately excluded.
deny = [
    # Known unmaintained / deprecated alternatives we don't want to drift back to.
    { crate = "openssl", reason = "use rustls + aws-lc-rs / ring instead" },
    { crate = "openssl-sys", reason = "transitively from openssl" },
    { crate = "rustls-native-certs:<0.7", reason = "older versions miss CA validation tightening" },
    # Insecure crypto primitives — never accept these into the dep tree.
    { crate = "md5", reason = "weak hash; use ring::digest::SHA256 or stronger" },
    { crate = "sha1", reason = "weak hash" },
]

# Multiple-version overrides — known transitive collisions we tolerate.
skip = []
skip-tree = []

# ─── Sources (registries) ────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
