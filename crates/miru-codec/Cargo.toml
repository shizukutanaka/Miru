[package]
publish = false
name = "miru-codec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
miru-common = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
vpx-sys = { version = "0.1", optional = true }
image = { workspace = true }

[features]
default = []
vpx = ["dep:vpx-sys"]   # VP9 encoding/decoding via libvpx
# Hardware encoding via libavcodec. Intentionally pulls in NO Rust crate: the
# binding is a C shim in csrc/ compiled by build.rs. Needs a C compiler and the
# ffmpeg dev libraries at build time (apt: libavcodec-dev libavutil-dev).
ffmpeg = []
