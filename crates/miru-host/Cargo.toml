[package]
publish = false
name = "miru-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "miru-host"
path = "src/main.rs"

[features]
# See ADR 0022. The AI-agent governance surface is a deliberate bet (ADR 0005)
# that is currently frozen, so it is off by default: the shipped binary carries
# no token issuance, no audit chain, no Rekor anchoring, and the input hot path
# has no agent gate compiled into it at all. `--features agent` restores it.
default = []
agent = ["dep:miru-agent", "dep:miru-transparency"]

[dependencies]
miru-common = { workspace = true }
miru-capture = { workspace = true }
miru-transport = { workspace = true }
miru-input = { workspace = true }
miru-codec = { workspace = true }
miru-audio = { path = "../miru-audio" }
miru-auth = { path = "../miru-auth" }
miru-agent = { path = "../miru-agent", optional = true }
miru-transparency = { path = "../miru-transparency", optional = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
flume = { workspace = true }
parking_lot = { workspace = true }
dirs = "5"
bytes = { workspace = true }
ring = { workspace = true }
base64 = "0.22"
uuid = { workspace = true }
miru-sandbox = { path = "../miru-sandbox" }
miru-discovery = { path = "../miru-discovery" }
miru-constellation = { path = "../miru-constellation" }
open = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rand = { workspace = true }
ed25519-dalek = { workspace = true }
