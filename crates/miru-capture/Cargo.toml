[package]
publish = false
name = "miru-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
miru-common = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }
cpal = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
core-graphics = "0.23"
# ScreenCaptureKit via raw binding (macOS 12.3+)

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "shm", "composite"] }
libc = "0.2"

[features]
default = []
# Wayland capture via xdg-desktop-portal + PipeWire. Like miru-codec's ffmpeg
# feature, this pulls in NO Rust crate: the binding is a C shim in csrc/
# compiled by build.rs. Needs libglib2.0-dev and libpipewire-0.3-dev.
pipewire = []
