[package]
publish = false
name = "miru-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model Context Protocol server — exposes Miru host control to Claude / any LLM."

[[bin]]
name = "miru-mcp"
path = "src/main.rs"

[dependencies]
miru-common = { workspace = true }
miru-agent = { path = "../miru-agent" }
miru-transport = { workspace = true }
miru-auth = { path = "../miru-auth" }
miru-codec = { path = "../miru-codec" }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
async-trait = { workspace = true }
dirs = "5"
parking_lot = { workspace = true }
thiserror = { workspace = true }
miru-sandbox = { path = "../miru-sandbox" }
miru-capture = { path = "../miru-capture" }
miru-input = { path = "../miru-input" }
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
open = "5"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
rand = { workspace = true }
